[pytest]
# History: lirk runs each pytest src with cwd = its package directory,
# and lirk <= 1.0.0 let pytest take that directory as rootdir, so the
# repo-root conftest.py was never loaded (confcutdir defaults to
# rootdir). This file was the workaround. Fixed in lirk 1.0.1 (PR #3),
# which pins --rootdir/--confcutdir to the repo root; verified without
# this file (docs/lirk-notes.md #1). Kept so plain `python3 -m pytest`
# from any directory behaves the same way.
addopts = -ra
